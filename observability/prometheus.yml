global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: mesa-ayuda-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:3000"]

  - job_name: mesa-ayuda-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["worker:9100"]

  - job_name: mesa-ayuda-webhook
    metrics_path: /metrics
    static_configs:
      - targets: ["webhook-receiver:4000"]
