services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-iaew_mesa_ayuda}
      POSTGRES_USER: ${POSTGRES_USER:-iaew}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-iaew-local}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - mesa-ayuda-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-iaew} -d ${POSTGRES_DB:-iaew_mesa_ayuda}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4.2-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBIT_USER:-iaew}
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASS:-iaew-local}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - mesa-ayuda-rabbit-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  webhook-receiver:
    build:
      context: .
      dockerfile: webhook-receiver/Dockerfile
    environment:
      PORT: 4000
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-colocar-secreto-compartido-local}
    ports:
      - "${WEBHOOK_PORT:-4000}:4000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/health"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: ${DATABASE_URL:-postgresql://iaew:iaew-local@db:5432/iaew_mesa_ayuda?schema=public}
      AUTH0_DOMAIN: ${AUTH0_DOMAIN:-example.us.auth0.com}
      AUTH0_AUDIENCE: ${AUTH0_AUDIENCE:-https://mesa-ayuda.local}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-colocar-api-key-local}
      RABBIT_URL: ${RABBIT_URL:-amqp://iaew:iaew-local@rabbitmq:5672}
      RABBIT_EXCHANGE: ${RABBIT_EXCHANGE:-mesa-ayuda.eventos}
      RABBIT_QUEUE: ${RABBIT_QUEUE:-mesa-ayuda.notificaciones}
      OUTBOX_POLL_MS: ${OUTBOX_POLL_MS:-2000}
    ports:
      - "${PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      webhook-receiver:
        condition: service_healthy
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: ${DATABASE_URL:-postgresql://iaew:iaew-local@db:5432/iaew_mesa_ayuda?schema=public}
      RABBIT_URL: ${RABBIT_URL:-amqp://iaew:iaew-local@rabbitmq:5672}
      RABBIT_EXCHANGE: ${RABBIT_EXCHANGE:-mesa-ayuda.eventos}
      RABBIT_QUEUE: ${RABBIT_QUEUE:-mesa-ayuda.notificaciones}
      WEBHOOK_URL: ${WEBHOOK_URL:-http://webhook-receiver:4000/webhooks/mesa-ayuda}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-colocar-secreto-compartido-local}
      METRICS_PORT: 9100
    ports:
      - "${WORKER_METRICS_PORT:-9100}:9100"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.7.3
    depends_on:
      api:
        condition: service_healthy
      worker:
        condition: service_started
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=7d"]
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - mesa-ayuda-prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.2.1
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin-local}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - mesa-ayuda-grafana-data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    restart: unless-stopped

volumes:
  mesa-ayuda-db-data:
  mesa-ayuda-rabbit-data:
  mesa-ayuda-prometheus-data:
  mesa-ayuda-grafana-data:
