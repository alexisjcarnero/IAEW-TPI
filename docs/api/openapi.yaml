openapi: 3.1.0
info:
  title: Mesa de ayuda API
  version: 1.0.2
  description: |
    API REST del TPI IAEW 2026. Gestiona tickets, usuarios y agentes, y
    ejecuta el escalamiento transaccional que genera un evento asincronico.
  contact:
    name: Equipo Mesa de ayuda - IAEW 2026
servers:
  - url: http://localhost:3000/api/v1
    description: Docker Compose local
tags:
  - name: Operacion
    description: Salud y endpoints internos de operacion.
  - name: Tickets
    description: Ciclo de vida, asignacion, escalamiento, comentarios y efectos.
  - name: Agentes
    description: Administracion de responsables de soporte.
  - name: Usuarios
    description: Administracion de solicitantes y supervisores.
security:
  - oauth2: []

paths:
  /health:
    servers: [{ url: "http://localhost:3000" }]
    get:
      tags: [Operacion]
      operationId: getHealth
      summary: Estado de API, PostgreSQL y RabbitMQ
      security: []
      responses:
        "200":
          description: Dependencias operativas
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
              example: { status: ok, db: up, broker: up }
        "503":
          description: Servicio degradado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }

  /internal/sla-policies:
    servers: [{ url: "http://localhost:3000" }]
    get:
      tags: [Operacion]
      operationId: listSlaPolicies
      summary: Lista politicas SLA (ejemplo de API key)
      security: [{ apiKey: [] }]
      responses:
        "200":
          description: Politicas configuradas
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/SlaPolicy" } }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /tickets:
    get:
      tags: [Tickets]
      operationId: listTickets
      summary: Lista tickets
      security: [{ oauth2: ["read:tickets"] }]
      parameters:
        - { name: estado, in: query, schema: { $ref: "#/components/schemas/EstadoTicket" } }
        - { name: prioridad, in: query, schema: { $ref: "#/components/schemas/Prioridad" } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        "200":
          description: Listado
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/Ticket" } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Tickets]
      operationId: createTicket
      summary: Crea un ticket y calcula su vencimiento SLA
      security: [{ oauth2: ["write:tickets"] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TicketCreate" }
            example:
              titulo: Sistema de facturacion caido
              descripcion: Todos los usuarios reciben error 500.
              prioridad: CRITICA
              solicitanteId: 11111111-1111-4111-8111-111111111111
      responses:
        "201":
          description: Creado
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ticket" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /tickets/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [Tickets]
      operationId: getTicket
      summary: Obtiene un ticket con historial
      security: [{ oauth2: ["read:tickets"] }]
      responses:
        "200":
          description: Ticket
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ticket" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Tickets]
      operationId: updateTicket
      summary: Actualiza datos o transiciona a EN_PROGRESO/RESUELTO
      security: [{ oauth2: ["write:tickets"] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TicketUpdate" }
            example: { estado: RESUELTO }
      responses:
        "200":
          description: Actualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ticket" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [Tickets]
      operationId: deleteTicket
      summary: Elimina un ticket ABIERTO sin historial
      security: [{ oauth2: ["write:tickets"] }]
      responses:
        "204": { description: Eliminado }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /tickets/{id}/asignacion:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      tags: [Tickets]
      operationId: assignTicket
      summary: Asigna un agente activo del nivel actual
      security: [{ oauth2: ["assign:tickets"] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agenteId]
              additionalProperties: false
              properties:
                agenteId: { type: string, format: uuid }
            example: { agenteId: 22222222-2222-4222-8222-222222222222 }
      responses:
        "200":
          description: Asignado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ticket" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /tickets/{id}/escalamientos:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      tags: [Tickets]
      operationId: escalateTicket
      summary: Escala el ticket y registra un evento outbox atomicamente
      description: |
        Valida estado, prioridad/riesgo SLA, responsable, nivel siguiente y
        agente destino. La transaccion serializable crea el historial, actualiza
        el ticket y persiste `ticket.escalado` en la outbox.
      security: [{ oauth2: ["write:tickets", "assign:tickets"] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EscalamientoCreate" }
            example:
              motivo: Incidente critico requiere especialista
              agenteDestinoId: 33333333-3333-4333-8333-333333333333
      responses:
        "201":
          description: Escalamiento confirmado; evento pendiente o ya publicado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EscalamientoResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /tickets/{id}/cierre:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      tags: [Tickets]
      operationId: closeTicket
      summary: Cierra un ticket RESUELTO y emite ticket.cerrado
      security: [{ oauth2: ["close:tickets"] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resolucion]
              additionalProperties: false
              properties:
                resolucion: { type: string, minLength: 1, maxLength: 2000 }
      responses:
        "200":
          description: Cerrado
          content:
            application/json:
              schema:
                type: object
                required: [ticket, evento]
                properties:
                  ticket: { $ref: "#/components/schemas/Ticket" }
                  evento: { $ref: "#/components/schemas/EventReference" }
        "409": { $ref: "#/components/responses/Conflict" }

  /tickets/{id}/comentarios:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [Tickets]
      operationId: listTicketComments
      summary: Lista comentarios
      security: [{ oauth2: ["read:tickets"] }]
      responses:
        "200":
          description: Comentarios
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/Comentario" } }
    post:
      tags: [Tickets]
      operationId: createTicketComment
      summary: Agrega comentario
      security: [{ oauth2: ["write:tickets"] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ComentarioCreate" }
      responses:
        "201":
          description: Creado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Comentario" }
        "409": { $ref: "#/components/responses/Conflict" }

  /tickets/{id}/notificaciones:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [Tickets]
      operationId: listTicketNotifications
      summary: Consulta el efecto persistido por el consumidor RabbitMQ
      security: [{ oauth2: ["read:tickets"] }]
      responses:
        "200":
          description: Notificaciones asincronicas
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/Notificacion" } }

  /agentes:
    get:
      tags: [Agentes]
      operationId: listAgents
      summary: Lista agentes
      security: [{ oauth2: ["assign:tickets"] }]
      parameters:
        - { name: nivel, in: query, schema: { $ref: "#/components/schemas/NivelAgente" } }
        - { name: activo, in: query, schema: { type: boolean } }
      responses:
        "200":
          description: Agentes
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/Agente" } }
    post:
      tags: [Agentes]
      operationId: createAgent
      summary: Crea agente
      security: [{ oauth2: ["assign:tickets"] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgenteCreate" }
      responses:
        "201":
          description: Creado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Agente" }
        "409": { $ref: "#/components/responses/Conflict" }

  /agentes/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [Agentes]
      operationId: getAgent
      summary: Obtiene agente
      security: [{ oauth2: ["assign:tickets"] }]
      responses:
        "200":
          description: Agente
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Agente" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Agentes]
      operationId: updateAgent
      summary: Actualiza o desactiva agente
      security: [{ oauth2: ["assign:tickets"] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgenteUpdate" }
      responses:
        "200":
          description: Actualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Agente" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Agentes]
      operationId: deleteAgent
      summary: Elimina agente sin historial
      security: [{ oauth2: ["assign:tickets"] }]
      responses:
        "204": { description: Eliminado }
        "409": { $ref: "#/components/responses/Conflict" }

  /usuarios:
    get:
      tags: [Usuarios]
      operationId: listUsers
      summary: Lista usuarios
      security: [{ oauth2: ["read:tickets"] }]
      responses:
        "200":
          description: Usuarios
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/Usuario" } }
    post:
      tags: [Usuarios]
      operationId: createUser
      summary: Crea usuario
      security: [{ oauth2: ["write:tickets"] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UsuarioCreate" }
      responses:
        "201":
          description: Creado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Usuario" }

  /usuarios/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [Usuarios]
      operationId: getUser
      summary: Obtiene usuario
      security: [{ oauth2: ["read:tickets"] }]
      responses:
        "200":
          description: Usuario
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Usuario" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Usuarios]
      operationId: updateUser
      summary: Actualiza usuario
      security: [{ oauth2: ["write:tickets"] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UsuarioUpdate" }
      responses:
        "200":
          description: Actualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Usuario" }
    delete:
      tags: [Usuarios]
      operationId: deleteUser
      summary: Elimina usuario sin tickets (ejemplo x-api-key)
      security: [{ apiKey: [] }]
      responses:
        "204": { description: Eliminado }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }

components:
  securitySchemes:
    oauth2:
      type: oauth2
      description: Auth0, grant client_credentials, access token JWT RS256
      flows:
        clientCredentials:
          tokenUrl: https://TU_TENANT.us.auth0.com/oauth/token
          scopes:
            read:tickets: Consultar tickets, usuarios y efectos
            write:tickets: Crear y actualizar tickets, usuarios y comentarios
            assign:tickets: Administrar agentes, asignar y escalar
            close:tickets: Cerrar tickets resueltos
    apiKey:
      type: apiKey
      in: header
      name: x-api-key

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    BadRequest:
      description: Entrada invalida
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Unauthorized:
      description: Credencial ausente, invalida o expirada
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Forbidden:
      description: Scope insuficiente
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    NotFound:
      description: Recurso inexistente
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Conflict:
      description: Regla de negocio o estado actual impide la operacion
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

  schemas:
    Prioridad: { type: string, enum: [BAJA, MEDIA, ALTA, CRITICA] }
    EstadoTicket: { type: string, enum: [ABIERTO, ASIGNADO, EN_PROGRESO, ESCALADO, RESUELTO, CERRADO] }
    NivelAgente: { type: string, enum: [N1, N2, N3] }
    RolUsuario: { type: string, enum: [SOLICITANTE, SUPERVISOR] }
    EstadoNotificacion: { type: string, enum: [PENDIENTE, ENVIADA, FALLIDA] }

    Health:
      type: object
      required: [status, db, broker]
      properties:
        status: { type: string, enum: [ok, degraded] }
        db: { type: string, enum: [up, down] }
        broker: { type: string, enum: [up, down] }

    Problem:
      type: object
      required: [type, title, status, correlationId]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        correlationId: { type: string }
        errors:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              message: { type: string }

    SlaPolicy:
      type: object
      required: [id, prioridad, minutosPrimeraRespuesta, minutosResolucion]
      properties:
        id: { type: string, format: uuid }
        prioridad: { $ref: "#/components/schemas/Prioridad" }
        minutosPrimeraRespuesta: { type: integer, minimum: 1 }
        minutosResolucion: { type: integer, minimum: 1 }

    Usuario:
      type: object
      required: [id, nombre, email, rol, creadoEn]
      properties:
        id: { type: string, format: uuid }
        nombre: { type: string }
        email: { type: string, format: email }
        rol: { $ref: "#/components/schemas/RolUsuario" }
        creadoEn: { type: string, format: date-time }
    UsuarioCreate:
      type: object
      required: [nombre, email]
      additionalProperties: false
      properties:
        nombre: { type: string, minLength: 1, maxLength: 120 }
        email: { type: string, format: email, maxLength: 254 }
        rol: { $ref: "#/components/schemas/RolUsuario" }
    UsuarioUpdate:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        nombre: { type: string, minLength: 1, maxLength: 120 }
        email: { type: string, format: email, maxLength: 254 }
        rol: { $ref: "#/components/schemas/RolUsuario" }

    Agente:
      type: object
      required: [id, nombre, email, nivel, activo, creadoEn]
      properties:
        id: { type: string, format: uuid }
        nombre: { type: string }
        email: { type: string, format: email }
        nivel: { $ref: "#/components/schemas/NivelAgente" }
        activo: { type: boolean }
        creadoEn: { type: string, format: date-time }
    AgenteCreate:
      type: object
      required: [nombre, email, nivel]
      additionalProperties: false
      properties:
        nombre: { type: string, minLength: 1, maxLength: 120 }
        email: { type: string, format: email, maxLength: 254 }
        nivel: { $ref: "#/components/schemas/NivelAgente" }
        activo: { type: boolean, default: true }
    AgenteUpdate:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        nombre: { type: string, minLength: 1, maxLength: 120 }
        email: { type: string, format: email, maxLength: 254 }
        nivel: { $ref: "#/components/schemas/NivelAgente" }
        activo: { type: boolean }

    Ticket:
      type: object
      required: [id, titulo, descripcion, prioridad, estado, nivelActual, solicitanteId, slaPolicyId, creadoEn, actualizadoEn, version]
      properties:
        id: { type: string, format: uuid }
        titulo: { type: string }
        descripcion: { type: string }
        prioridad: { $ref: "#/components/schemas/Prioridad" }
        estado: { $ref: "#/components/schemas/EstadoTicket" }
        nivelActual: { $ref: "#/components/schemas/NivelAgente" }
        solicitanteId: { type: string, format: uuid }
        agenteAsignadoId: { type: [string, "null"], format: uuid }
        slaPolicyId: { type: string, format: uuid }
        venceSlaAt: { type: [string, "null"], format: date-time }
        creadoEn: { type: string, format: date-time }
        actualizadoEn: { type: string, format: date-time }
        cerradoEn: { type: [string, "null"], format: date-time }
        version: { type: integer, minimum: 1 }
        solicitante: { $ref: "#/components/schemas/Usuario" }
        agenteAsignado:
          oneOf:
            - { $ref: "#/components/schemas/Agente" }
            - { type: "null" }
        slaPolicy: { $ref: "#/components/schemas/SlaPolicy" }
    TicketCreate:
      type: object
      required: [titulo, descripcion, solicitanteId]
      additionalProperties: false
      properties:
        titulo: { type: string, minLength: 1, maxLength: 160 }
        descripcion: { type: string, minLength: 1, maxLength: 4000 }
        prioridad: { $ref: "#/components/schemas/Prioridad" }
        solicitanteId: { type: string, format: uuid }
    TicketUpdate:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        titulo: { type: string, minLength: 1, maxLength: 160 }
        descripcion: { type: string, minLength: 1, maxLength: 4000 }
        prioridad: { $ref: "#/components/schemas/Prioridad" }
        estado: { type: string, enum: [EN_PROGRESO, RESUELTO] }

    Comentario:
      type: object
      required: [id, ticketId, autor, texto, creadoEn]
      properties:
        id: { type: string, format: uuid }
        ticketId: { type: string, format: uuid }
        autor: { type: string }
        texto: { type: string }
        creadoEn: { type: string, format: date-time }
    ComentarioCreate:
      type: object
      required: [autor, texto]
      additionalProperties: false
      properties:
        autor: { type: string, minLength: 1, maxLength: 120 }
        texto: { type: string, minLength: 1, maxLength: 2000 }

    Escalamiento:
      type: object
      required: [id, ticketId, nivelOrigen, nivelDestino, motivo, creadoEn]
      properties:
        id: { type: string, format: uuid }
        ticketId: { type: string, format: uuid }
        nivelOrigen: { $ref: "#/components/schemas/NivelAgente" }
        nivelDestino: { $ref: "#/components/schemas/NivelAgente" }
        agenteDestinoId: { type: [string, "null"], format: uuid }
        motivo: { type: string }
        creadoEn: { type: string, format: date-time }
    EscalamientoCreate:
      type: object
      required: [motivo]
      additionalProperties: false
      properties:
        motivo: { type: string, minLength: 1, maxLength: 500 }
        agenteDestinoId: { type: string, format: uuid }
    EscalamientoResult:
      type: object
      required: [ticket, escalamiento, evento]
      properties:
        ticket: { $ref: "#/components/schemas/Ticket" }
        escalamiento: { $ref: "#/components/schemas/Escalamiento" }
        evento: { $ref: "#/components/schemas/EventReference" }
    EventReference:
      type: object
      required: [id, estado]
      properties:
        id: { type: string, format: uuid }
        estado: { type: string, enum: [PENDIENTE_O_PUBLICADO] }

    Notificacion:
      type: object
      required: [id, eventoId, ticketId, tipo, mensaje, estado, intentos, creadoEn]
      properties:
        id: { type: string, format: uuid }
        eventoId: { type: string, format: uuid }
        ticketId: { type: string, format: uuid }
        tipo: { type: string, enum: [ticket.escalado, ticket.cerrado] }
        mensaje: { type: string }
        estado: { $ref: "#/components/schemas/EstadoNotificacion" }
        intentos: { type: integer, minimum: 0 }
        webhookStatus: { type: [integer, "null"] }
        creadoEn: { type: string, format: date-time }
        procesadoEn: { type: [string, "null"], format: date-time }
